<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Presage</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/forms.css" />
    <link rel="stylesheet" href="styles/session.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 20" width="32" height="20" aria-hidden="true">
            <circle cx="11" cy="10" r="9" fill="#7c5cff" />
            <circle cx="21" cy="10" r="9" fill="#2dd4bf" fill-opacity="0.78" />
          </svg>
          <span class="brand-name">Presage</span>
          <span class="brand-version" id="app-version"></span>
        </div>
        <button class="btn primary wide" id="new-session" type="button">New session</button>
        <div class="side-label">Sessions</div>
        <nav id="session-list" aria-label="Sessions"></nav>
        <button class="side-link" id="open-settings" type="button">Settings</button>
      </aside>
      <main id="main"></main>
      <aside id="inspector" aria-label="Inspector"></aside>
    </div>
    <div id="error-banner" role="alert" hidden>
      <div id="error-lines"></div>
      <button class="btn" id="error-dismiss" type="button">Dismiss</button>
    </div>
    <script src="js/errors.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
