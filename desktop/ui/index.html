<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Presage</title>
    <script src="js/boot.js"></script>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/glass.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/forms.css" />
    <link rel="stylesheet" href="styles/session.css" />
    <link rel="stylesheet" href="styles/tools.css" />
    <link rel="stylesheet" href="styles/panel.css" />
  </head>
  <body>
    <div id="backdrop" aria-hidden="true">
      <canvas id="backdrop-art"></canvas>
      <canvas id="backdrop-dither"></canvas>
    </div>
    <div id="app">
      <aside id="sidebar">
        <div class="brand" data-tauri-drag-region="deep">
          <svg class="brand-mark" viewBox="0 0 32 20" width="26" height="16" aria-hidden="true">
            <circle cx="11" cy="10" r="9" fill="currentColor" />
            <circle cx="21" cy="10" r="9" fill="currentColor" fill-opacity="0.38" />
          </svg>
          <span class="brand-name">Presage</span>
        </div>
        <button class="nav-item" id="new-session" type="button">New session</button>
        <nav id="session-list" aria-label="Sessions"></nav>
        <div class="side-foot">
          <button class="nav-item" id="open-settings" type="button">Settings</button>
        </div>
      </aside>
      <main id="main"></main>
      <aside id="inspector" aria-label="Inspector">
        <div class="pane-strip" data-tauri-drag-region></div>
        <div id="inspector-tabs"></div>
        <div id="inspector-body"></div>
      </aside>
      <div id="sheet-strip" data-tauri-drag-region></div>
      <button class="pane-toggle" id="toggle-sidebar" type="button" aria-controls="sidebar"></button>
      <button class="pane-toggle" id="toggle-inspector" type="button" aria-controls="inspector"></button>
      <div class="window-controls">
        <button id="win-min" type="button" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.75 6.5h6.5" /></svg>
        </button>
        <button id="win-max" type="button" aria-label="Maximize" title="Maximize">
          <svg class="when-normal" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M4.5 2.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z" /></svg>
          <svg class="when-maximized" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M4 4.5h2.5A1.5 1.5 0 0 1 8 6v2.5A1.5 1.5 0 0 1 6.5 10H4a1.5 1.5 0 0 1-1.5-1.5V6A1.5 1.5 0 0 1 4 4.5zM5 2.5h3A1.5 1.5 0 0 1 9.5 4v3" /></svg>
        </button>
        <button id="win-close" type="button" aria-label="Close" title="Close">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>
    </div>
    <div id="error-banner" role="alert" hidden>
      <div id="error-lines"></div>
      <button class="btn" id="error-dismiss" type="button">Dismiss</button>
    </div>
    <script src="js/errors.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
