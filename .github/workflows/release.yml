name: Release desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  # A branch dispatch verifies the same tests and installer without publishing.
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        shell: pwsh
        run: |
          # The version pinned in rust-toolchain.toml, the same one local builds and CI use.
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"$').Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }

      - name: Check release versions
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'sage-desktop').version
          $config = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $config.version -ne $version) {
            throw 'Cargo and Tauri must have the same stable release version'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Typecheck, lint and test
        shell: pwsh
        run: |
          cargo check --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          Get-ChildItem desktop/ui/js -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $_" }
          }

      - name: Build Windows installer
        working-directory: desktop
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Prepare and hash release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          if ($installers[0].Name -ne "Sage_$env:VERSION`_x64-setup.exe") {
            throw "Unexpected installer name: $($installers[0].Name)"
          }
          Copy-Item $installers[0].FullName release/
          Copy-Item target/release/sage-desktop.exe "release/Sage_$env:VERSION`_x64.exe"
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS-windows.txt -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  # The `sage` command line, one archive per platform, with the README and the licence.
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86_64-linux
          - os: macos-latest
            platform: aarch64-macos
          - os: windows-latest
            platform: x86_64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"\r*$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal

      - name: Install OpenSSL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Test
        shell: bash
        run: cargo test -p sage-cli -p sage-core --locked

      - name: Build
        shell: bash
        run: cargo build --release -p sage-cli --locked

      # The binary itself: it starts everywhere, and where the tasks' bash and python3 are at hand,
      # it solves the seven easy benchmark tasks offline, a stand-in playing the model.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          target/release/sage --version
          if [ "$RUNNER_OS" != Windows ]; then
            SAGE_HOME="$RUNNER_TEMP/sage-home" target/release/sage bench --scripted --variants sage --tasks easy -n 1 | tee bench.txt
            grep -E '^ALL +sage +7/7 ' bench.txt
          fi

      - name: Exercise chat and unattended CLI entry points
        if: runner.os != 'Windows'
        run: python3 crates/sage-cli/tests/cli_smoke.py target/release/sage

      - name: Check the 23 benchmark exercises offline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/polyglot.py "$RUNNER_TEMP/polyblind"
          cd "$RUNNER_TEMP/polyblind"
          # The fixture build embeds held-out tests, so it uses a separate target directory.
          cargo run --locked -p sage-cli -- bench --check --tasks polyblind

      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"\r*$/\1/p' Cargo.toml | head -n 1)
          name="sage-$version-$PLATFORM"
          mkdir -p "stage/$name" release
          cp README.md LICENSE "stage/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/sage.exe "stage/$name/"
            (cd stage && 7z a -tzip "../release/$name.zip" "$name" > /dev/null)
          else
            cp target/release/sage "stage/$name/"
            "stage/$name/sage" --version
            tar -C stage -czf "release/$name.tar.gz" "$name"
          fi
          ls -l release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.platform }}-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, cli]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true

      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release/RELEASE-NOTES.md <<'NOTES'
          # Sage @VERSION@

          A fix release: one security fix, a handful of bug fixes, and a system prompt that gives general advice.

          ## Security
          - **API keys stay out of the conversation.** The commands Sage runs no longer see the provider API keys in your environment (`OPENAI_API_KEY`, `DEEPSEEK_API_KEY` and the rest). Before, a command such as `env` could send a key to the model and into the session's logs. A project whose own tests need one of these variables has to be given it another way.

          ## Fixes
          - **A handled Python error is no longer a failure.** A command that catches an exception and prints its traceback, then exits 0, is no longer reported as failed.
          - **Loading the code is not checking it.** On a task held to a document (a README, a spec), a check that only imports or builds the code no longer stands for checking the document's rules: `finish` asks for that once first.
          - **The first message leaves out ignored files.** Build output, logs and other files your `.gitignore` excludes are no longer attached to it, and no longer push real files out.
          - **No stale budget note.** "Your next reply is the last one" is no longer added after a run has already finished.
          - **`sage key` hides the key** as you type it.
          - **GPT-6 Luna is priced**, so its cost is shown, at its list price.
          - CI now checks changes to the system prompt, the skills and the benchmark tasks, and runs the command-line smoke test.

          ## Changed
          - **The system prompt is general advice.** The edge cases to check are general ones (empty and boundary inputs, end of input, ordering, splitting and joining, errors and the line they report); a check has to run the code on real inputs; text between tool calls stays short. The HTML and CSS advice stays.
          - The benchmark pages price GPT-6 Luna at its list price: Sage is 21% cheaper than OpenCode with it (24% with DeepSeek V4.1 Flash), not 43%.

          ## Command line
          - **sage-@VERSION@-x86_64-linux.tar.gz**, **sage-@VERSION@-aarch64-macos.tar.gz**, **sage-@VERSION@-x86_64-windows.zip**: unpack and put `sage` on your PATH. On macOS, run `xattr -d com.apple.quarantine sage` once.

          ## Windows desktop app (Windows 10/11, 64-bit)
          - **Sage_@VERSION@_x64-setup.exe**: recommended installer.
          - **Sage_@VERSION@_x64.exe**: standalone app; requires the Microsoft Edge WebView2 Runtime.

          **SHA256SUMS.txt** has a SHA-256 checksum for every download.

          Built from commit @SHA@. The tests passed on Linux, macOS and Windows before packaging, and the Linux and macOS command lines each solved seven benchmark tasks offline with a scripted stand-in for the model. Nothing is code-signed, so Windows and macOS may warn about an unknown publisher.
          NOTES
          sed -i -e 's/^          //' -e "s/@VERSION@/$VERSION/g" -e "s/@SHA@/$GITHUB_SHA/g" release/RELEASE-NOTES.md

      - name: Verify assets and publish release
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS-windows.txt
          assets=("Sage_${VERSION}_x64-setup.exe" "Sage_${VERSION}_x64.exe"
                  "sage-${VERSION}-x86_64-linux.tar.gz" "sage-${VERSION}-aarch64-macos.tar.gz"
                  "sage-${VERSION}-x86_64-windows.zip")
          ls -l "${assets[@]}"
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          # Refuse existing tags, including tags without a release, so --target
          # cannot silently publish an older commit. No assets are overwritten.
          count=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq 'length')
          test "$count" = 0 || { echo "Tag $TAG already exists; refusing to overwrite it"; exit 1; }
          gh release create "$TAG" "${assets[@]}" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Sage $VERSION" --notes-file RELEASE-NOTES.md --latest
