name: CI

# A change to the docs alone builds nothing, so it is not checked. Only the Markdown at the top
# and in docs/ is docs: the system prompt, the skills and the benchmark tasks are Markdown too, and
# they are built into the program and tested.
on:
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: --workspace
          - os: windows-latest
            packages: --workspace
          # What is released for macOS: the command line, not the desktop app. Its shell and
          # session lock are where macOS differs (bash 3.2, file locks).
          - os: macos-latest
            packages: -p sage-core -p sage-cli
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux desktop system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"\r*$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
      # The compiled dependencies, kept between runs: only Sage's own crates are built again.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.packages }}
      - name: JavaScript syntax and lint
        if: runner.os == 'Linux'
        run: |
          find desktop/ui/js desktop/tests -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;
          npx --yes eslint@9 --config desktop/tests/eslint.config.mjs desktop/ui/js desktop/tests
          npx --yes stylelint@16 'desktop/ui/styles/*.css' --config desktop/tests/stylelint.json
      - name: Run desktop browser regressions
        if: runner.os == 'Linux'
        working-directory: desktop/tests
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node check-browser.mjs
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy ${{ matrix.packages }} --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test ${{ matrix.packages }} --locked
      # The chat in a terminal and `sage run`, against a local stand-in for a provider.
      - name: Exercise the CLI entry points
        if: runner.os != 'Windows'
        run: |
          cargo build -p sage-cli --locked
          python3 crates/sage-cli/tests/cli_smoke.py target/debug/sage
