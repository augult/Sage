# Settings of the report service.
name = reports
root = /srv/${name}          ; everything lives below this

[server]
listen[] = 127.0.0.1:8080
listen[] = "[::1]:8080"
banner = "  ${name} ready\n"
workers = 4

[paths]
data = ${root}/data
logs = ${paths:data}/logs    # forward and backward references both work
archive = ${root}/archive \
          ${root}/cold

[mail]
subject = "Report #${server:workers}: \u00fcbersicht"
footer = costs 5$$ per page
